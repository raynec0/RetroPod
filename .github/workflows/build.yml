name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded update zip (if any)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Applying $z"
              rm -rf _update && mkdir _update
              unzip -q -o "$z" -d _update
              src=_update
              if [ -f _update/RetroPod/project.yml ]; then src=_update/RetroPod; fi
              rsync -a --exclude '.github' --exclude '__MACOSX' "$src"/ ./
              rm -rf _update "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply update from uploaded zip" || true
            git push || echo "Push failed; building with the applied files anyway"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RetroPod.xcodeproj \
            -target RetroPod \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "======== 编译错误汇总（复制这里发给 Claude） ========"
          grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RetroPod.app Payload/
          zip -qry RetroPod.ipa Payload
          ls -lh RetroPod.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroPod-ipa
          path: RetroPod.ipa

      - name: Publish IPA to release and ipa branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" RetroPod.ipa --title "RetroPod $VER（构建 ${{ github.run_number }}）" --notes "未签名 ipa，自签后安装。" --target "${{ github.sha }}" || echo "release failed"
          mkdir -p _ipa && cp RetroPod.ipa _ipa/ && cd _ipa
          git init -q -b ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
          git add RetroPod.ipa && git commit -qm "$TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ipa:ipa
